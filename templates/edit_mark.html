
{% extends "base.html" %}

{% block content %}
<div class="marks-page">
    <div class="page-header">
        <h1>Edit Marks</h1>
        <p>Update the student assessment record.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="notice {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <div class="panel">
        <h2>Edit Marks Record</h2>

        <form
            action="{{ url_for('edit_mark', mark_id=mark.id) }}"
            method="POST"
            class="vertical-form"
        >
            <label for="student_id">Select Student</label>
            <select id="student_id" name="student_id" required>
                {% for student in all_students %}
                <option
                    value="{{ student.id }}"
                    {% if student.id == mark.student_id %}selected{% endif %}
                >
                    {{ student.roll_no }} - {{ student.name }}
                </option>
                {% endfor %}
            </select>

            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
                {% for subject_name in subjects %}
                <option
                    value="{{ subject_name }}"
                    {% if subject_name == mark.subject %}selected{% endif %}
                >
                    {{ subject_name }}
                </option>
                {% endfor %}
            </select>

            
<label for="assessment">Assessment</label>
<select id="assessment" name="assessment" required>
    <option value="Internal 1"
        {% if mark.assessment == "Internal 1" %}selected{% endif %}>
        Internal 1 (50 marks)
    </option>

    <option value="Internal 2"
        {% if mark.assessment == "Internal 2" %}selected{% endif %}>
        Internal 2 (50 marks)
    </option>

    <option value="Semester Exam"
        {% if mark.assessment == "Semester Exam" %}selected{% endif %}>
        Semester Exam (100 marks)
    </option>
</select>


            <label for="marks_obtained">Marks Obtained (Internal: 50, Semester: 100)</label>
            <input
                id="marks_obtained"
                type="number"
                name="marks_obtained"
                min="0"
                max="100"
                step="any"
                value="{{ mark.marks_obtained }}"
                required
            >

            <button type="submit">Save Changes</button>
            <a href="{{ url_for('marks_page') }}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
